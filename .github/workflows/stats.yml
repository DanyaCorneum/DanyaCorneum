name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # GitHub Stats
      # ============================================================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&bg_color=0D1117&title_color=7AA2F7&text_color=A9B1D6&icon_color=BB9AF7&border_color=292E42&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ============================================================
      # Top Languages
      # ============================================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=Jupyter%20Notebook&bg_color=0D1117&title_color=7AA2F7&text_color=A9B1D6&border_color=292E42&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ============================================================
      # GitHub Streak
      # ============================================================

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&background=0D1117&border=292E42&stroke=292E42&ring=7AA2F7&fire=BB9AF7&currStreakNum=7AA2F7&sideNums=A9B1D6&currStreakLabel=7AA2F7&sideLabels=A9B1D6&dates=565F89&disable_animations=true&hide_border=true"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Contribution Snake
      # ============================================================

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?palette=github
            profile/github-snake-dark.svg?palette=github-dark

      # ============================================================
      # LeetCode
      # ============================================================

      - name: Generate LeetCode Stats
        uses: lowlighter/metrics@master
        with:
          filename: profile/leetcode.svg

          user: DanyaCorneum

          token: ${{ secrets.GITHUB_TOKEN }}

          base: ""

          plugin_leetcode: yes
          plugin_leetcode_user: Danya_Corneum
          plugin_leetcode_sections: solved,skills,recent

          plugin_leetcode_limit_skills: 8
          plugin_leetcode_limit_recent: 4

          config_theme: dark

          output_action: none

          plugins_errors_fatal: yes

      # ============================================================
      # Commit generated files
      # ============================================================

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "chore: update profile stats"

          git push
